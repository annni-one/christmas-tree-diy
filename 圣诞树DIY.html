<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>圣诞树DIY · 点亮你的专属圣诞</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 4L10 14h4l-3 6h5v8h4v-8h5l-3-6h4z' fill='%23a8c8ff'/><circle cx='16' cy='4' r='2' fill='%23ffd88a'/></svg>">
<style>
/* ========== 梦幻配色体系 ========== */
:root {
  --bg-deep: #1a1f3a;
  --bg-panel: rgba(30, 38, 70, 0.6);
  --bg-panel-light: rgba(50, 60, 100, 0.5);
  --border: rgba(255,255,255,0.1);
  --border-bright: rgba(255,255,255,0.2);
  --text-primary: #f5f7ff;
  --text-secondary: #a0a8d0;
  --text-muted: #606890;
  --gold: #ffd88a;
  --gold-glow: rgba(255,216,138,0.4);
  --blue: #8ab4ff;
  --pink: #f0a8d0;
  --red: #f07070;
  --mint: #8ae8c0;
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --blur: 12px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: url('assets/dreamy-bg.png') center / cover no-repeat fixed;
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
}

/* 雪花飘落动画层 */
.snow-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.snowflake {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.7;
  animation: snowfall linear infinite;
}

@keyframes snowfall {
  0% { transform: translateY(-10px) translateX(0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.6; }
  100% { transform: translateY(100vh) translateX(30px); opacity: 0; }
}

/* ========== 顶部工具栏 ========== */
.topbar {
  position: relative;
  z-index: 10;
  height: 60px;
  background: var(--bg-panel);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 0 8px var(--gold-glow));
}

.logo-sub {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 400;
  margin-left: 4px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 按钮通用样式 */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-panel-light);
  backdrop-filter: blur(8px);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}

.btn:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
  border-color: var(--border-bright);
  box-shadow: 0 0 16px rgba(255,255,255,0.1);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold), #ffb86a);
  color: #2a1f0a;
  border-color: transparent;
  font-weight: 600;
  box-shadow: 0 0 20px var(--gold-glow);
}

.btn-primary:hover {
  background: linear-gradient(135deg, #ffe0a0, #ffc878);
  color: #2a1f0a;
  box-shadow: 0 0 28px var(--gold-glow);
}

.btn svg {
  width: 16px;
  height: 16px;
}

.divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 4px;
}

/* ========== 主区域 ========== */
.main {
  position: relative;
  z-index: 2;
  display: flex;
  height: calc(100vh - 60px);
}

/* ========== 左侧装饰品面板 ========== */
.sidebar {
  width: 260px;
  background: var(--bg-panel);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 16px 16px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.category-tabs {
  display: flex;
  gap: 4px;
  padding: 0 12px 12px;
  flex-wrap: wrap;
}

.category-tab {
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}

.category-tab:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
}

.category-tab.active {
  background: rgba(255,216,138,0.15);
  color: var(--gold);
  border-color: rgba(255,216,138,0.3);
  box-shadow: 0 0 12px rgba(255,216,138,0.15);
}

.decor-grid {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px 16px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  align-content: start;
}

.decor-item {
  aspect-ratio: 1;
  background: var(--bg-panel-light);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
}

.decor-item:hover {
  border-color: var(--gold);
  background: rgba(255,216,138,0.1);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(255,216,138,0.2);
}

.decor-item svg {
  width: 36px;
  height: 36px;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.2));
}

.decor-item-label {
  position: absolute;
  bottom: 4px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 9px;
  color: var(--text-muted);
}

/* ========== 中间画布区域 ========== */
.canvas-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
}

.canvas-frame {
  width: 360px;
  height: 640px;
  border-radius: 16px;
  border: 1px solid var(--border-bright);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(138,180,255,0.2), var(--shadow);
  background: linear-gradient(180deg, #0d1228 0%, #141a35 50%, #0d1228 100%);
}

/* 画布内占位提示 */
.canvas-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  pointer-events: none;
}

/* 圣诞树容器 */
.tree-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 280px;
  z-index: 2;
}

.tree-container img {
  width: 100%;
  height: auto;
  mix-blend-mode: screen;
  pointer-events: none;
}

/* 树选择缩略图 */
.tree-select-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.tree-thumb {
  aspect-ratio: 1;
  background: var(--bg-panel-light);
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tree-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  mix-blend-mode: screen;
}

.tree-thumb:hover {
  border-color: var(--border-bright);
}

.tree-thumb.active {
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(255,216,138,0.3);
}

/* 树色选择 */
.tree-color-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tree-color-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  box-shadow: 0 0 8px currentColor;
}

.tree-color-dot.active {
  border-color: #fff;
  transform: scale(1.15);
}

/* 底部祝福语区域（画布内） */
.canvas-greeting {
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: "Georgia", "Times New Roman", serif;
  font-style: italic;
  font-size: 28px;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold-glow), 0 2px 8px rgba(0,0,0,0.5);
  letter-spacing: 1px;
}

.canvas-greeting-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.8);
  margin-top: 4px;
  font-style: normal;
  letter-spacing: 3px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

/* ========== 右侧属性面板 ========== */
.props-panel {
  width: 240px;
  background: var(--bg-panel);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border-left: 1px solid var(--border);
  padding: 16px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.props-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.props-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.props-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.props-slider {
  width: 100%;
  -webkit-appearance: none;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  outline: none;
}

.props-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--gold);
  cursor: pointer;
  box-shadow: 0 0 8px var(--gold-glow);
}

.color-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.color-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.color-dot.active {
  border-color: #fff;
  transform: scale(1.1);
  box-shadow: 0 0 12px rgba(255,255,255,0.4);
}

.props-delete {
  margin-top: auto;
  padding: 10px;
  background: rgba(240,112,112,0.15);
  border: 1px solid rgba(240,112,112,0.3);
  color: var(--red);
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.props-delete:hover {
  background: rgba(240,112,112,0.25);
  box-shadow: 0 0 12px rgba(240,112,112,0.2);
}

/* ========== 画布上的装饰元素 ========== */
.canvas-decor {
  position: absolute;
  width: 40px;
  height: 40px;
  cursor: move;
  user-select: none;
  -webkit-user-select: none;
  transition: box-shadow 0.2s;
  z-index: 5;
}

.canvas-decor svg {
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.canvas-decor img {
  width: 100%;
  height: auto;
  object-fit: contain;
  pointer-events: none;
  mix-blend-mode: screen;
}

.canvas-decor.selected {
  outline: 2px dashed var(--gold);
  outline-offset: 4px;
  border-radius: 8px;
}

/* ========== 底部祝福语编辑条 ========== */
.greeting-bar {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-panel);
  backdrop-filter: blur(var(--blur));
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  box-shadow: var(--shadow);
}

.greeting-input {
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 16px;
  outline: none;
  width: 200px;
  text-align: center;
}

.greeting-input::placeholder {
  color: var(--text-muted);
}

/* ========== Toast 提示 ========== */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(40, 50, 90, 0.9);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-bright);
  color: var(--text-primary);
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: 13px;
  box-shadow: var(--shadow);
  opacity: 0;
  transition: all 0.3s;
  z-index: 100;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 移动端适配 */
@media (max-width: 768px) {
  body { overflow: auto; }
  .topbar { padding: 0 12px; height: 52px; }
  .logo-sub { display: none; }
  .btn { font-size: 12px; padding: 6px 10px; }
  .topbar-right .btn:not(.btn-primary) { display: none; }
  .divider { display: none; }

  .main { flex-direction: column; height: auto; }
  .sidebar {
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .decor-grid { grid-template-columns: repeat(6, 1fr); }
  .decor-item svg { width: 28px; height: 28px; }

  .canvas-area { padding: 16px; }
  .canvas-frame { width: 100%; max-width: 360px; height: 560px; }

  .props-panel { display: none; }

  .greeting-bar { position: static; transform: none; margin-top: 16px; width: 100%; max-width: 360px; }
  .greeting-input { width: 140px; }
}

/* 滚动条美化 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
</style>
</head>

<!-- 雪花层 -->
<div class="snow-layer" id="snow-layer"></div>

<!-- ===== 顶部工具栏 ===== -->

  <div class="topbar-left">
    <div class="logo">
      <div class="logo-icon">

          <path d="M16 4L10 14h4l-3 6h5v8h4v-8h5l-3-6h4z" fill="#8ae8c0"/>
          <circle cx="16" cy="4" r="2" fill="#ffd88a"/>
        </svg>
      </div>
      <span>圣诞树DIY</span>

    </div>
  </div>
  <div class="topbar-right">
    <button class="btn" id="btn-undo" title="撤销">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
      撤销
    </button>
    <button class="btn" id="btn-redo" title="重做">

      清空

    <button class="btn btn-primary" id="btn-export">

<!-- ===== 主区域 ===== -->

    let content = '';

      content = `<img src="${item.img}" style="width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,255,255,0.2))">`;
    } else {
      content = item.svg;
    }
    el.innerHTML = `
      ${content}
      <div class="decor-item-label">${item.name}</div>
    `;
    el.onclick = () => addDecorToCanvas(content, item.name);
    grid.appendChild(el);
  });
}

// ========== DIY交互：添加/拖拽/选中/删除/缩放旋转 ==========
const canvasFrame = document.getElementById('canvas-frame');
let selectedEl = null;
let dragState = null;

// 添加装饰到画布
function addDecorToCanvas(content, name) {
  const el = document.createElement('div');
  el.className = 'canvas-decor';
  el.innerHTML = content;
  // 闪光树类素材默认和圣诞树一样大（宽280px，高度自适应）
  const isBig = name.includes('树');
  if (isBig) {
    el.style.width = '280px';
    el.style.height = 'auto';
  } else {
    el.style.width = '40px';
    el.style.height = '40px';
  }
  // 位置：大素材居中对齐树，小素材随机
  const cx = canvasFrame.clientWidth / 2;
  const cy = canvasFrame.clientHeight / 2;
  if (isBig) {
    el.style.left = (cx - 140) + 'px';
    el.style.top = (cy - 180) + 'px';
  } else {
    el.style.left = (cx + (Math.random() - 0.5) * 60 - 20) + 'px';
    el.style.top = (cy + (Math.random() - 0.5) * 80 - 20) + 'px';
  }
  el.dataset.name = name;
  el.dataset.scale = 1;
  el.dataset.rotation = 0;
  canvasFrame.appendChild(el);
  selectDecor(el);
}

// 选中装饰
function selectDecor(el) {
  if (selectedEl) selectedEl.classList.remove('selected');
  selectedEl = el;
  if (el) {
    el.classList.add('selected');
    // 同步滑块
    const scale = parseFloat(el.dataset.scale);
    const rotation = parseFloat(el.dataset.rotation);
    document.querySelectorAll('.props-slider')[0].value = scale * 100;
    document.querySelectorAll('.props-slider')[1].value = rotation;
  }
}

// 点击画布空白处取消选中
canvasFrame.addEventListener('click', (e) => {
  if (e.target === canvasFrame || e.target.closest('.tree-svg') || e.target.closest('.canvas-greeting')) {
    selectDecor(null);
  }
});

// 拖拽逻辑
canvasFrame.addEventListener('mousedown', (e) => {
  const el = e.target.closest('.canvas-decor');
  if (!el) return;
  e.preventDefault();
  selectDecor(el);
  const rect = canvasFrame.getBoundingClientRect();
  dragState = {
    el: el,
    offsetX: e.clientX - rect.left - el.offsetLeft,
    offsetY: e.clientY - rect.top - el.offsetTop,
  };
});

document.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  const rect = canvasFrame.getBoundingClientRect();
  let x = e.clientX - rect.left - dragState.offsetX;
  let y = e.clientY - rect.top - dragState.offsetY;
  // 限制在画布内
  x = Math.max(0, Math.min(x, canvasFrame.clientWidth - 40));
  y = Math.max(0, Math.min(y, canvasFrame.clientHeight - 40));
  dragState.el.style.left = x + 'px';
  dragState.el.style.top = y + 'px';
});

document.addEventListener('mouseup', () => {
  dragState = null;
});

// 缩放滑块
document.querySelectorAll('.props-slider')[0].oninput = (e) => {
  if (!selectedEl) return;
  const scale = e.target.value / 100;
  selectedEl.dataset.scale = scale;
  selectedEl.style.transform = `scale(${scale}) rotate(${selectedEl.dataset.rotation}deg)`;
};

// 旋转滑块
document.querySelectorAll('.props-slider')[1].oninput = (e) => {
  if (!selectedEl) return;
  const rotation = e.target.value;
  selectedEl.dataset.rotation = rotation;

// ========== 第四步：撤销/重做/清空/自动保存 ==========
const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 50;

// 保存当前画布状态到历史栈
function pushHistory() {
  const decorHTML = Array.from(canvasFrame.querySelectorAll('.canvas-decor')).map(el => ({
    name: el.dataset.name,
    left: el.style.left,
    top: el.style.top,
    width: el.style.width,
    height: el.style.height,
    scale: el.dataset.scale,
    rotation: el.dataset.rotation,
    innerHTML: el.innerHTML
  }));
  undoStack.push({
    decorHTML,
    treeImg: document.getElementById('tree-img').src,
    greeting: document.querySelector('.canvas-greeting').childNodes[0].textContent,
    greetingSub: document.querySelector('.canvas-greeting-sub').textContent
  });
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  updateUndoRedoButtons();
}

// 从历史栈恢复
function restoreFromState(state) {
  // 清空现有装饰
  canvasFrame.querySelectorAll('.canvas-decor').forEach(el => el.remove());
  // 恢复装饰
  state.decorHTML.forEach(decor => {
    const el = document.createElement('div');
    el.className = 'canvas-decor';
    el.innerHTML = decor.innerHTML;
    el.style.left = decor.left;
    el.style.top = decor.top;
    el.style.width = decor.width;
    el.style.height = decor.height;
    el.dataset.name = decor.name;
    el.dataset.scale = decor.scale;
    el.dataset.rotation = decor.rotation;
    el.style.transform = `scale(${decor.scale}) rotate(${decor.rotation}deg)`;
    canvasFrame.appendChild(el);
  });
  // 恢复圣诞树
  document.getElementById('tree-img').src = state.treeImg;
  document.querySelectorAll('.tree-thumb').forEach(t => {
    t.classList.toggle('active', t.dataset.img === state.treeImg);
  });
  // 恢复祝福语
  document.querySelector('.canvas-greeting').childNodes[0].textContent = state.greeting + ' ';
  document.querySelector('.canvas-greeting-sub').textContent = state.greetingSub;
  document.getElementById('greeting-input').value = state.greeting;
  document.getElementById('greeting-sub-input').value = state.greetingSub;
  selectDecor(null);
}

// 更新撤销/重做按钮状态
function updateUndoRedoButtons() {
  document.getElementById('btn-undo').disabled = undoStack.length === 0;
  document.getElementById('btn-redo').disabled = redoStack.length === 0;
  document.getElementById('btn-undo').style.opacity = undoStack.length === 0 ? 0.5 : 1;
  document.getElementById('btn-redo').style.opacity = redoStack.length === 0 ? 0.5 : 1;
}

// 撤销
document.getElementById('btn-undo').onclick = () => {
  if (undoStack.length === 0) return;
  const currentState = {
    decorHTML: Array.from(canvasFrame.querySelectorAll('.canvas-decor')).map(el => ({
      name: el.dataset.name, left: el.style.left, top: el.style.top,
      width: el.style.width, height: el.style.height,
      scale: el.dataset.scale, rotation: el.dataset.rotation, innerHTML: el.innerHTML
    })),
    treeImg: document.getElementById('tree-img').src,
    greeting: document.querySelector('.canvas-greeting').childNodes[0].textContent,
    greetingSub: document.querySelector('.canvas-greeting-sub').textContent
  };
  redoStack.push(currentState);
  const prevState = undoStack.pop();
  restoreFromState(prevState);
  updateUndoRedoButtons();
  saveToLocal();
  showToast('已撤销');
};

// 重做
document.getElementById('btn-redo').onclick = () => {
  if (redoStack.length === 0) return;
  const currentState = {
    decorHTML: Array.from(canvasFrame.querySelectorAll('.canvas-decor')).map(el => ({
      name: el.dataset.name, left: el.style.left, top: el.style.top,
      width: el.style.width, height: el.style.height,
      scale: el.dataset.scale, rotation: el.dataset.rotation, innerHTML: el.innerHTML
    })),
    treeImg: document.getElementById('tree-img').src,
    greeting: document.querySelector('.canvas-greeting').childNodes[0].textContent,
    greetingSub: document.querySelector('.canvas-greeting-sub').textContent
  };
  undoStack.push(currentState);
  const nextState = redoStack.pop();
  restoreFromState(nextState);
  updateUndoRedoButtons();
  saveToLocal();
  showToast('已重做');
};

// 清空
document.getElementById('btn-clear').onclick = () => {
  if (canvasFrame.querySelectorAll('.canvas-decor').length === 0) {
    showToast('画布已经是空的');
    return;
  }
  pushHistory();
  canvasFrame.querySelectorAll('.canvas-decor').forEach(el => el.remove());
  selectDecor(null);
  saveToLocal();
  showToast('已清空画布');
};

// 自动保存到 localStorage
function saveToLocal() {
  const state = {
    decorHTML: Array.from(canvasFrame.querySelectorAll('.canvas-decor')).map(el => ({
      name: el.dataset.name, left: el.style.left, top: el.style.top,
      width: el.style.width, height: el.style.height,
      scale: el.dataset.scale, rotation: el.dataset.rotation, innerHTML: el.innerHTML
    })),
    treeImg: document.getElementById('tree-img').src,
    greeting: document.getElementById('greeting-input').value,
    greetingSub: document.getElementById('greeting-sub-input').value,
    savedAt: new Date().toISOString()
  };
  try {
    localStorage.setItem('christmasDIY_save', JSON.stringify(state));
  } catch(e) { console.warn('保存失败', e); }
}

// 从 localStorage 加载
function loadFromLocal() {
  try {
    const raw = localStorage.getItem('christmasDIY_save');
    if (!raw) return;
    const state = JSON.parse(raw);
    restoreFromState(state);
    showToast('已自动恢复上次的作品');
  } catch(e) { console.warn('加载失败', e); }
}

// 初始化：页面加载时自动恢复
loadFromLocal();
updateUndoRedoButtons();

// 操作后自动保存（添加/删除/修改装饰时调用）
const originalAddDecor = addDecorToCanvas;
addDecorToCanvas = function(content, name) {
  pushHistory();
  originalAddDecor(content, name);
  saveToLocal();
};

// 监听删除按钮
const originalDelete = document.querySelector('.props-delete').onclick;
document.querySelector('.props-delete').onclick = () => {
  if (!selectedEl) {
    showToast('请先选中一个装饰品');
    return;
  }
  pushHistory();
  selectedEl.remove();
  selectedEl = null;
  saveToLocal();
};

// 监听拖拽结束（保存位置）
canvasFrame.addEventListener('mouseup', () => {
  if (dragState) {
    saveToLocal();
  }
});

// 监听祝福语输入变化
document.getElementById('greeting-input').oninput = (e) => {
  document.querySelector('.canvas-greeting').childNodes[0].textContent = e.target.value + ' ';
  saveToLocal();
};
document.getElementById('greeting-sub-input').oninput = (e) => {
  document.querySelector('.canvas-greeting-sub').textContent = e.target.value;
  saveToLocal();
};

// ========== 第五步：Canvas 高分辨率PNG导出 ==========
document.getElementById('btn-export').onclick = async () => {
  showToast('正在生成高清图片...');
  const scale = 2; // 2倍分辨率
  const w = canvasFrame.clientWidth;
  const h = canvasFrame.clientHeight;
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // 1. 绘制深蓝色背景
  ctx.fillStyle = '#0a1628';
  ctx.fillRect(0, 0, w, h);

  // 2. 绘制圣诞树
  const treeImg = document.getElementById('tree-img');
  if (treeImg && treeImg.src) {
    await drawImageFromUrl(ctx, treeImg.src, treeImg.offsetLeft, treeImg.offsetTop, treeImg.width, treeImg.height);
  }

  // 3. 绘制所有装饰元素
  const decorEls = canvasFrame.querySelectorAll('.canvas-decor');
  for (const el of decorEls) {
    const left = parseFloat(el.style.left);
    const top = parseFloat(el.style.top);
    const width = el.offsetWidth;
    const height = el.offsetHeight;
    const scaleVal = parseFloat(el.dataset.scale || 1);
    const rotation = parseFloat(el.dataset.rotation || 0);

    ctx.save();
    ctx.translate(left + width / 2, top + height / 2);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.scale(scaleVal, scaleVal);

    const img = el.querySelector('img');
    const svg = el.querySelector('svg');

    if (img) {
      await drawImageFromUrl(ctx, img.src, -width / 2, -height / 2, width, height);
    } else if (svg) {
      // SVG转图片绘制
      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      await drawImageFromUrl(ctx, url, -width / 2, -height / 2, width, height);
      URL.revokeObjectURL(url);
    }
    ctx.restore();
  }

  // 4. 绘制祝福语
  const greetingEl = document.querySelector('.canvas-greeting');
  const greetingText = document.getElementById('greeting-input').value || 'Merry Christmas';
  const greetingSub = document.getElementById('greeting-sub-input').value || '圣诞快乐';
  const gRect = greetingEl.getBoundingClientRect();
  const cRect = canvasFrame.getBoundingClientRect();
  const gLeft = gRect.left - cRect.left + gRect.width / 2;
  const gTop = gRect.top - cRect.top + gRect.height / 2;

  ctx.fillStyle = '#ffd88a';
  ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(greetingText, gLeft, gTop);

  ctx.fillStyle = 'rgba(255,216,138,0.7)';
  ctx.font = '14px "Microsoft YaHei", sans-serif';
  ctx.fillText(greetingSub, gLeft, gTop + 24);

  // 5. 导出PNG并下载
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '圣诞树DIY_' + Date.now() + '.png';
    a.click();
    URL.revokeObjectURL(url);
    showToast('高清图片已导出！');
  }, 'image/png');
};

// 辅助：绘制图片（处理跨域和加载）
function drawImageFromUrl(ctx, url, x, y, w, h) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      ctx.drawImage(img, x, y, w, h);
      resolve();
    };
    img.onerror = () => resolve(); // 失败就跳过
    img.src = url;
  });
}
</script>
